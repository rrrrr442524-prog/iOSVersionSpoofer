name: Build iOSVersionSpoofer

on:
  workflow_dispatch:
  push:
    branches:
    - main

jobs:
  build:
    runs-on: macos-latest

    steps:
· name: Checkout
        uses: actions/checkout@v4

· name: Setup Theos
        uses: waruhachi/theos-action@v2.6.6
        with:
          altlist: true

· name: Build Rootless DEB
        run: |
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless ARCHS="arm64 arm64e"

· name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: Rootless-DEB
          path: packages/*.deb

